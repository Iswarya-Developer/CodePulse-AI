server:
  port: 8082

spring:
  application:
    name: auth-service

    #datasource:
    # url: jdbc:mysql://localhost:3306/codepulse_auth
    #username: root
    #password: root

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "*"