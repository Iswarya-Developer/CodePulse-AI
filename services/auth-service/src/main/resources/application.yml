server:
  port: 8082

spring:
  application:
    name: auth-service

  # FIX: Indent 'url', 'username', and 'password' underneath 'datasource'
  datasource:
    url: jdbc:mysql://localhost:3306/codepulse_auth
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "*"

jwt:
  secret: 4P7yQwN2xLm8RkJ5vHs9AaBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890ABCD
  expiration: 3600000